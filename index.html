:root{--mn:#38f0b0;--am:#ffb020;--or:#ff7a2f;--sa:#e3c48c;--mu:#8a93a3;--tx:#f1f4f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#04060a;font-family:Poppins,"Segoe UI",Arial,sans-serif;color:var(--tx);display:flex;align-items:center;justify-content:center}
#st{flex:none;width:1280px;height:700px;position:relative;transform-origin:center}
.strip{position:absolute;left:24px;right:24px;top:0;height:32px;display:flex;align-items:center;justify-content:space-between}
.strip .l,.strip .r{display:flex;align-items:center;gap:5px}.strip button.m{padding:0 5px;min-width:24px;font-size:9.5px;border-radius:6px}.strip .sp{width:1px;height:14px;background:#2a323d;margin:0 4px}
.strip button{height:21px;min-width:26px;border:1px solid #2a323d;background:#0e131a;color:#aab3c0;border-radius:7px;font:600 10px Poppins,Arial,sans-serif;cursor:pointer;padding:0 8px;transition:.15s}
.strip button:hover{border-color:var(--mn)}.strip button.on{background:var(--mn);border-color:var(--mn);color:#04231a}
.strip em{font-style:normal;font-size:10.5px;color:#8f99a8;margin-right:4px}
.strip a{width:21px;height:21px;border-radius:50%;background:#0e131a;border:1px solid #2a323d;display:flex;align-items:center;justify-content:center;transition:.15s}.strip a:hover{background:var(--mn);border-color:var(--mn)}.strip a:hover svg{fill:#04231a}.strip a svg{width:11px;height:11px;fill:#c3cbd6}

.hd .sc{font:700 26px "Dancing Script","Segoe Script","Brush Script MT",cursive;background:linear-gradient(90deg,#38f0b0,#1bb88a);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.05;margin-top:1px;white-space:nowrap}
.kc{padding:11px 14px;border-left:3px solid var(--c)}
.kc .kt{font-size:11.5px;font-weight:600;color:#cdd4de}.kc .kv{font-size:21px;font-weight:700;letter-spacing:-.4px;margin-top:3px}.kc .kd{font-size:10.5px;color:var(--mu);margin-top:2px}.kc .kd b{color:var(--c);font-weight:700}
.kc svg{position:absolute;right:0;bottom:6px;width:90px;height:34px;opacity:.7}
.kc:before{content:"";position:absolute;left:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--c);opacity:.12;filter:blur(18px)}
.bu{padding:10px 14px}.bu .tp{display:flex;justify-content:space-between;align-items:center}.bu h3{font-size:13.5px;font-weight:700}.bu h3 small{display:block;font-size:9.5px;font-weight:500;color:var(--mu)}

.bu svg{display:block;margin-top:-2px}
.bu .tr{transition:opacity .9s ease}.ax{cursor:pointer}.ax:hover .nr{filter:brightness(1.25)}

.dl .rw{display:grid;grid-template-columns:repeat(3,1fr);margin-top:0}.dl .dd{text-align:center}.dl .dd svg{width:80px;height:84px;display:block;margin:0 auto}.dl .dd span{display:block;font-size:9.5px;color:#aab3c0;font-weight:500;margin-top:-1px;line-height:1.1}
